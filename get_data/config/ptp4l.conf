# PTP grandmaster for the sensor rig (linuxptp, ptp4l).
#
# Every Ethernet sensor sits on its own USB NIC (r8152), which has no hardware
# timestamping, so ptp4l runs with software timestamping and serves the system
# clock (CLOCK_REALTIME) on all four ports. Expected accuracy: tens of us.
#
# Start: sudo ptp4l -f get_data/config/ptp4l.conf -m
# or install get_data/config/ptp4l-cvlab.service (see README).

[global]
time_stamping           software
# Always win the master election (the Basler cameras use priority1 = 255)
priority1               1
priority2               1
domainNumber            0
network_transport       UDPv4
delay_mechanism         E2E
# Never steer the system clock from a sensor
free_running            1
# Each port has its own (software) clock source
boundary_clock_jbod     1
logging_level           6

# Basler RGB left (192.168.1.70)
[enx00e04c680234]
# Basler RGB right (192.168.1.71)
[enx00e04c680059]
# Livox HAP (192.168.1.100)
[enx00e04c6802f2]
network_transport       L2
# Hesai XT32 (192.168.1.91) is NOT served: it cannot follow a two-step master
# (its clock jumped by seconds when tried on 2026-10-09), and software timestamping
# can only do two-step. Keep its clock source on GPS (free running); its files
# store [lidar_ns, host_ns] pairs to map its clock to the host clock.
